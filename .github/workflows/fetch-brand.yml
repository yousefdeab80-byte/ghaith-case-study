# مؤقت: بينزل لوجو المؤسسة من موقعها ويحطه في المشروع (الحاوية اللي بتبني منها مش بتوصل للموقع).
name: fetch-brand
on:
  push:
    branches: [batch-1]
    paths: [.github/workflows/fetch-brand.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p brand-src
          cd brand-src
          curl -fsSL -A "Mozilla/5.0" -o coster.png https://ghaithfoundation.org/wp-content/uploads/2024/09/coster.png
          curl -fsSL -A "Mozilla/5.0" -o logo-og.webp https://ghaithfoundation.org/wp-content/uploads/2024/10/logo-300x248-1.webp
          curl -fsSL -A "Mozilla/5.0" -o fav.webp https://ghaithfoundation.org/wp-content/uploads/2024/09/cropped-Ghaith-fav.png-270x270.webp
          curl -fsSL -A "Mozilla/5.0" -o home.html https://ghaithfoundation.org/ || true
          ls -la
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add brand-src
          git commit -m "brand: download logo files from ghaithfoundation.org"
          git push
